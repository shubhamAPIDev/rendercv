design:
  theme: engineeringresumes
  page:
    size: a4
    show_top_note: false
    top_margin: 0.5in
    bottom_margin: 0.5in
    left_margin: 0.6in
    right_margin: 0.6in
  typography:
    line_spacing: 0.55em
    font_size:
      body: 9pt
      name: 22pt
  sections:
